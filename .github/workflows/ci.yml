name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore JsonPretty.sln

      - name: Build
        run: dotnet build JsonPretty.sln -c Release --no-restore

      - name: Test
        run: dotnet test JsonPretty.sln -c Release --no-build --logger "console;verbosity=normal"
